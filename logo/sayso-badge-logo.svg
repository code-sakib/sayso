<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="SaySo badge">
  <defs>
    <radialGradient id="shell" cx="38%" cy="30%" r="80%">
      <stop offset="0" stop-color="#34383D"/>
      <stop offset="0.55" stop-color="#1B1D21"/>
      <stop offset="1" stop-color="#0E0F12"/>
    </radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.28"/>
      <stop offset="0.45" stop-color="#FFFFFF" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.35"/>
    </linearGradient>
    <radialGradient id="face" cx="45%" cy="35%" r="70%">
      <stop offset="0" stop-color="#2B2E33"/>
      <stop offset="1" stop-color="#16181B"/>
    </radialGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6E757C"/>
      <stop offset="0.5" stop-color="#C9CED4"/>
      <stop offset="1" stop-color="#8A9198"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#EF4444" stop-opacity="0.75"/>
      <stop offset="0.4" stop-color="#EF4444" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#EF4444" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="led" cx="40%" cy="35%" r="65%">
      <stop offset="0" stop-color="#FF8A8A"/>
      <stop offset="0.45" stop-color="#EF4444"/>
      <stop offset="1" stop-color="#B91C1C"/>
    </radialGradient>
  </defs>
  <!-- USB-C tab on the top edge -->
  <rect x="216" y="34" width="80" height="40" rx="10" fill="#0D0F12"/>
  <rect x="226" y="38" width="60" height="6" rx="3" fill="#FFFFFF" opacity="0.12"/>
  <!-- record button on the left edge -->
  <rect x="34" y="198" width="30" height="62" rx="12" fill="url(#metal)"/>
  <!-- the puck -->
  <circle cx="256" cy="272" r="212" fill="url(#shell)"/>
  <circle cx="256" cy="272" r="210" fill="none" stroke="url(#rim)" stroke-width="4"/>
  <circle cx="256" cy="272" r="178" fill="url(#face)"/>
  <circle cx="256" cy="272" r="178" fill="none" stroke="#000000" stroke-opacity="0.25" stroke-width="2"/>
  <!-- recording light -->
  <circle cx="256" cy="158" r="52" fill="url(#glow)"/>
  <circle cx="256" cy="158" r="15" fill="url(#led)"/>
  <circle cx="251" cy="153" r="4" fill="#FFFFFF" opacity="0.7"/>
</svg>
